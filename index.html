<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PANDA Lab — Physical AI and Autonomous Robotics. Website coming soon.">
  <meta name="theme-color" content="#f6f7f3">
  <title>PANDA Lab — Physical AI and Autonomous Robotics</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183329;background:#f6f7f3;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}body{margin:0}
    main{min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:clamp(28px,8vw,112px)}
    .intro{width:min(100%,1040px);margin:0 auto}
    .mark{display:block;width:48px;height:6px;margin-bottom:clamp(38px,7vw,72px);border-radius:3px;background:#33785c}
    h1{margin:0;font-size:clamp(54px,10vw,120px);font-weight:650;line-height:1.05;letter-spacing:-.065em}
    h1 span{font-weight:350;color:#527562}
    .name{max-width:720px;margin:24px 0 0;font-size:clamp(20px,3.2vw,32px);font-weight:400;line-height:1.45;letter-spacing:-.02em}
    .status{display:flex;align-items:center;gap:12px;margin:clamp(48px,9vw,96px) 0 0;padding-top:24px;border-top:1px solid #d6ded5;font-size:15px;line-height:1.6; color:#53665b}
    .status::before{content:"";flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#33785c}
  </style>
</head>
<body>
  <main><div class="intro">
    <span class="mark" aria-hidden="true"></span>
    <h1>PANDA <span>Lab</span></h1>
    <p class="name">Physical AI and Autonomous Robotics</p>
    <p class="status">Website coming soon.</p>
  </div></main>
</body>
</html>
